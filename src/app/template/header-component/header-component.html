<header class="site-header" [class.is-open]="menuAbierto">
  <div class="site-header__bar page">
    <a routerLink="/inicio" class="brand" (click)="cerrarMenu()" aria-label="Renfi, ir al inicio">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#1b4332" />
        <path d="M6 15.5 16 7l10 8.5" fill="none" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M9.5 14.6V24h13v-9.4" fill="none" stroke="#fcfbf9" stroke-width="2" stroke-linejoin="round" />
        <path d="M14 24v-3.8a2 2 0 0 1 4 0V24" fill="none" stroke="#fcfbf9" stroke-width="2" />
      </svg>
      <span class="brand__copy">
        <span class="brand__name">Renfi</span>
        <span class="brand__tagline">Fincas de recreo en Colombia</span>
      </span>
    </a>

    <button
      type="button"
      class="icon-btn site-header__toggle"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-controls="menu-principal"
      [attr.aria-label]="menuAbierto ? 'Cerrar menú' : 'Abrir menú'"
    >
      <svg *ngIf="!menuAbierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="7" x2="20" y2="7"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="17" x2="20" y2="17"></line>
      </svg>
      <svg *ngIf="menuAbierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <nav class="site-nav" id="menu-principal" aria-label="Navegación principal">
      <ul class="site-nav__links">
        <li><a routerLink="/inicio" fragment="portafolio" (click)="cerrarMenu()">Fincas</a></li>
        <li><a routerLink="/inicio" fragment="procesos" (click)="cerrarMenu()">Cómo funciona</a></li>
        <li><a routerLink="/sobre-nosotros" routerLinkActive="is-active" (click)="cerrarMenu()">Sobre nosotros</a></li>
      </ul>

      <div class="site-nav__auth" *ngIf="usuario$ | async as usuario; else invitado">
        <a *ngIf="esAdmin$ | async" routerLink="/administrador" class="btn btn--ghost btn--sm" (click)="cerrarMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" rx="1"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1"></rect>
          </svg>
          Panel admin
        </a>
        <a routerLink="/mi-cuenta" routerLinkActive="is-active" class="account-chip" (click)="cerrarMenu()" title="Mi cuenta">
          <span class="account-chip__avatar" aria-hidden="true">{{ getInicial(usuario) }}</span>
          <span class="account-chip__name">{{ getNombreCorto(usuario) }}</span>
        </a>
        <button type="button" class="btn btn--ghost btn--sm site-nav__logout" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>

      <ng-template #invitado>
        <div class="site-nav__auth">
          <a routerLink="/iniciar-sesion" class="btn btn--ghost btn--sm" (click)="cerrarMenu()">Iniciar sesión</a>
          <a routerLink="/registrarse" class="btn btn--primary btn--sm" (click)="cerrarMenu()">Crear cuenta</a>
        </div>
      </ng-template>
    </nav>
  </div>
</header>

<div class="panel">
	<p class="alert alert--error" role="alert" *ngIf="error">{{ error }}</p>
	<p class="panel__loading" *ngIf="cargando" role="status"><span class="spinner" aria-hidden="true"></span> Cargando fincas…</p>

	<ng-container *ngIf="!cargando && !error">
		<p class="muted" *ngIf="!fincas.length">No hay fincas todavía. Crea una en la sección Fincas para poder subirle fotos.</p>

		<ng-container *ngIf="fincas.length">
			<div class="field selector">
				<label class="field__label" for="img-finca">Finca</label>
				<select id="img-finca" [value]="idFinca" (change)="elegir($any($event.target).value)">
					<option *ngFor="let f of fincas" [value]="f.IdFinca" [selected]="f.IdFinca === idFinca">{{ f.NombreFinca }} · {{ f.NombreMunicipio }}</option>
				</select>
			</div>

			<app-galeria-finca *ngIf="idFinca" [idFinca]="idFinca"></app-galeria-finca>
		</ng-container>
	</ng-container>
</div>

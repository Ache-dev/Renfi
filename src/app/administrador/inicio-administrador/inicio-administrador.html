<div class="dashboard">
	<div class="dashboard__toolbar">
		<button type="button" class="btn btn--secondary btn--sm" (click)="refrescar()">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
				<path d="M3 3v5h5"></path>
				<path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
				<path d="M16 16h5v5"></path>
			</svg>
			Actualizar datos
		</button>
	</div>

	<ul class="tiles">
		<li *ngFor="let indicador of indicadores">
			<a class="tile" [routerLink]="indicador.ruta" [attr.aria-busy]="indicador.cargando">
				<span class="tile__head">
					<span class="tile__icon" [ngSwitch]="indicador.icono">
						<svg *ngSwitchCase="'usuarios'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
							<circle cx="9" cy="7" r="4"></circle>
							<path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
							<path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
						</svg>
						<svg *ngSwitchCase="'fincas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
							<polyline points="9 22 9 12 15 12 15 22"></polyline>
						</svg>
						<svg *ngSwitchCase="'reservas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<rect x="3" y="4" width="18" height="18" rx="2"></rect>
							<line x1="16" y1="2" x2="16" y2="6"></line>
							<line x1="8" y1="2" x2="8" y2="6"></line>
							<line x1="3" y1="10" x2="21" y2="10"></line>
						</svg>
						<svg *ngSwitchCase="'pagos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<rect x="2" y="5" width="20" height="14" rx="2"></rect>
							<line x1="2" y1="10" x2="22" y2="10"></line>
						</svg>
						<svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<circle cx="12" cy="12" r="9"></circle>
						</svg>
					</span>
					<span class="tile__title">{{ indicador.titulo }}</span>
				</span>

				<span class="tile__value tabular" *ngIf="!indicador.cargando && !indicador.error">{{ indicador.total ?? '—' }}</span>
				<span class="tile__value" *ngIf="indicador.cargando">
					<span class="spinner" aria-hidden="true"></span>
					<span class="visually-hidden">Cargando</span>
				</span>
				<span class="tile__value" *ngIf="indicador.error && !indicador.cargando">
					<span class="badge badge--danger" [title]="indicador.error">Sin datos</span>
				</span>

				<span class="tile__desc">{{ indicador.descripcion }}</span>
			</a>
		</li>
	</ul>

	<div class="reports" *ngIf="reportes.length">
		<section class="card report" *ngFor="let reporte of reportes">
			<header class="report__head">
				<h2>{{ reporte.titulo }}</h2>
				<p>{{ reporte.descripcion }}</p>
			</header>

			<div aria-live="polite">
				<p class="report__state" *ngIf="reporte.cargando" role="status">
					<span class="spinner" aria-hidden="true"></span>
					Cargando información…
				</p>

				<p class="alert alert--error" *ngIf="reporte.error && !reporte.cargando">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<circle cx="12" cy="12" r="10"></circle>
						<line x1="12" y1="8" x2="12" y2="12"></line>
						<line x1="12" y1="16" x2="12.01" y2="16"></line>
					</svg>
					{{ reporte.error }}
				</p>

				<ng-container *ngIf="!reporte.cargando && !reporte.error">
					<div class="table-wrap" *ngIf="reporte.filas.length; else reporteVacio">
						<table>
							<thead>
								<tr>
									<th scope="col" *ngFor="let columna of reporte.columnas">{{ columna.label }}</th>
								</tr>
							</thead>
							<tbody>
								<tr *ngFor="let fila of reporte.filas">
									<td *ngFor="let columna of reporte.columnas">
										<span [title]="formatearValor(fila[columna.key])">{{ formatearValor(fila[columna.key]) }}</span>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
					<ng-template #reporteVacio>
						<p class="report__state">Sin datos para mostrar en este momento.</p>
					</ng-template>
				</ng-container>
			</div>
		</section>
	</div>
</div>

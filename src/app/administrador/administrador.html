<div class="admin-layout" [class.sidebar-colapsado]="sidebarColapsado">
	<app-header-administrador
		[titulo]="tituloActual"
		[descripcion]="descripcionActual"
		[sidebarColapsado]="sidebarColapsado"
		(menuToggle)="alternarSidebar()"
	></app-header-administrador>

	<div class="admin-cuerpo">
		<aside
			class="admin-sidebar"
			#sidebarContainer
			appDragScroll
		>
			<div class="sidebar-encabezado">
				<span class="sidebar-logo">Renfi Admin</span>
			</div>

			<nav class="sidebar-nav" aria-label="Navegación del administrador">
				<a
					*ngFor="let link of navLinks"
					[routerLink]="link.route"
					routerLinkActive="activo"
					[routerLinkActiveOptions]="{ exact: link.route === '/administrador' }"
					class="sidebar-link"
					[attr.aria-label]="link.label"
					[attr.data-label]="link.label"
				>
					<span class="sidebar-icon" aria-hidden="true" [ngSwitch]="link.icon">
						<!-- Inicio / Dashboard -->
						<svg *ngSwitchCase="'inicio'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<rect x="3" y="3" width="7" height="9" rx="1"></rect>
							<rect x="14" y="3" width="7" height="5" rx="1"></rect>
							<rect x="14" y="12" width="7" height="9" rx="1"></rect>
							<rect x="3" y="16" width="7" height="5" rx="1"></rect>
						</svg>

						<!-- Usuarios -->
						<svg *ngSwitchCase="'usuarios'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
							<circle cx="9" cy="7" r="4"></circle>
							<path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
							<path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
						</svg>

						<!-- Fincas -->
						<svg *ngSwitchCase="'fincas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
							<polyline points="9 22 9 12 15 12 15 22"></polyline>
						</svg>

						<!-- Reservas -->
						<svg *ngSwitchCase="'reservas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
							<line x1="16" y1="2" x2="16" y2="6"></line>
							<line x1="8" y1="2" x2="8" y2="6"></line>
							<line x1="3" y1="10" x2="21" y2="10"></line>
						</svg>

						<!-- Pagos -->
						<svg *ngSwitchCase="'pagos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
							<line x1="1" y1="10" x2="23" y2="10"></line>
						</svg>

						<!-- Facturas -->
						<svg *ngSwitchCase="'facturas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
							<polyline points="14 2 14 8 20 8"></polyline>
							<line x1="16" y1="13" x2="8" y2="13"></line>
							<line x1="16" y1="17" x2="8" y2="17"></line>
						</svg>

						<!-- Metodos de pago -->
						<svg *ngSwitchCase="'metodos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<rect x="2" y="6" width="20" height="12" rx="2"></rect>
							<circle cx="16" cy="12" r="2"></circle>
							<path d="M6 12h.01"></path>
						</svg>

						<!-- Imagenes -->
						<svg *ngSwitchCase="'imagenes'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
							<circle cx="8.5" cy="8.5" r="1.5"></circle>
							<polyline points="21 15 16 10 5 21"></polyline>
						</svg>

						<!-- Municipios -->
						<svg *ngSwitchCase="'municipios'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
							<circle cx="12" cy="10" r="3"></circle>
						</svg>

						<!-- Roles -->
						<svg *ngSwitchCase="'roles'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
						</svg>

						<!-- Default fallback -->
						<svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="12" cy="12" r="10"></circle>
						</svg>
					</span>
					<span class="sidebar-text">
						<strong>{{ link.label }}</strong>
						<small>{{ link.description }}</small>
					</span>
				</a>
			</nav>
		</aside>

		<button
			type="button"
			class="sidebar-overlay"
			*ngIf="!sidebarColapsado"
			(click)="alternarSidebar()"
			aria-label="Ocultar menú lateral"
		></button>

		<main class="admin-contenido" aria-live="polite">
			<div class="admin-contenido__inner">
				<router-outlet></router-outlet>
			</div>
		</main>
	</div>
</div>

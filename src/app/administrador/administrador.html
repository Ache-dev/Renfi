<div class="admin" [class.admin--nav-cerrado]="sidebarColapsado">
	<aside class="admin-nav" id="admin-nav">
		<a routerLink="/administrador" class="admin-nav__brand" aria-label="Renfi Administración, ir al resumen">
			<svg class="admin-nav__mark" viewBox="0 0 32 32" aria-hidden="true">
				<rect width="32" height="32" rx="9" fill="#081c15" />
				<path d="M6 15.5 16 7l10 8.5" fill="none" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
				<path d="M9.5 14.6V24h13v-9.4" fill="none" stroke="#fcfbf9" stroke-width="2" stroke-linejoin="round" />
				<path d="M14 24v-3.8a2 2 0 0 1 4 0V24" fill="none" stroke="#fcfbf9" stroke-width="2" />
			</svg>
			<span class="admin-nav__brand-copy">
				<span class="admin-nav__name">Renfi</span>
				<span class="admin-nav__sub">Administración</span>
			</span>
		</a>

		<nav class="admin-nav__menu" aria-label="Navegación del administrador">
			<ul class="admin-nav__list">
				<li *ngFor="let link of navLinks">
					<a
						[routerLink]="link.route"
						routerLinkActive="is-active"
						ariaCurrentWhenActive="page"
						[routerLinkActiveOptions]="{ exact: link.route === '/administrador' }"
						class="admin-nav__link"
					>
						<span [ngSwitch]="link.icon" class="admin-nav__icon">
							<svg *ngSwitchCase="'inicio'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="3" y="3" width="7" height="9" rx="1"></rect>
								<rect x="14" y="3" width="7" height="5" rx="1"></rect>
								<rect x="14" y="12" width="7" height="9" rx="1"></rect>
								<rect x="3" y="16" width="7" height="5" rx="1"></rect>
							</svg>
							<svg *ngSwitchCase="'usuarios'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
								<circle cx="9" cy="7" r="4"></circle>
								<path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
								<path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
							</svg>
							<svg *ngSwitchCase="'fincas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
								<polyline points="9 22 9 12 15 12 15 22"></polyline>
							</svg>
							<svg *ngSwitchCase="'reservas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="3" y="4" width="18" height="18" rx="2"></rect>
								<line x1="16" y1="2" x2="16" y2="6"></line>
								<line x1="8" y1="2" x2="8" y2="6"></line>
								<line x1="3" y1="10" x2="21" y2="10"></line>
							</svg>
							<svg *ngSwitchCase="'pagos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="2" y="5" width="20" height="14" rx="2"></rect>
								<line x1="2" y1="10" x2="22" y2="10"></line>
							</svg>
							<svg *ngSwitchCase="'facturas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
								<polyline points="14 2 14 8 20 8"></polyline>
								<line x1="16" y1="13" x2="8" y2="13"></line>
								<line x1="16" y1="17" x2="8" y2="17"></line>
							</svg>
							<svg *ngSwitchCase="'metodos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path>
								<path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path>
							</svg>
							<svg *ngSwitchCase="'imagenes'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="3" y="3" width="18" height="18" rx="2"></rect>
								<circle cx="9" cy="9" r="2"></circle>
								<path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"></path>
							</svg>
							<svg *ngSwitchCase="'municipios'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path>
								<circle cx="12" cy="10" r="3"></circle>
							</svg>
							<svg *ngSwitchCase="'roles'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
								<path d="m9 12 2 2 4-4"></path>
							</svg>
							<svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<circle cx="12" cy="12" r="9"></circle>
							</svg>
						</span>
						<span class="admin-nav__label">{{ link.label }}</span>
					</a>
				</li>
			</ul>
		</nav>

		<div class="admin-nav__foot">
			<a routerLink="/inicio" class="admin-nav__portal">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
					<polyline points="15 3 21 3 21 9"></polyline>
					<line x1="10" y1="14" x2="21" y2="3"></line>
				</svg>
				<span>Ver portal público</span>
			</a>
		</div>
	</aside>

	<button
		type="button"
		class="admin-overlay"
		*ngIf="!sidebarColapsado"
		(click)="alternarSidebar()"
		aria-label="Ocultar menú lateral"
	></button>

	<div class="admin-col">
		<app-header-administrador
			[titulo]="tituloActual"
			[descripcion]="descripcionActual"
			[sidebarColapsado]="sidebarColapsado"
			(menuToggle)="alternarSidebar()"
		></app-header-administrador>

		<div class="admin-content">
			<router-outlet></router-outlet>
		</div>
	</div>
</div>

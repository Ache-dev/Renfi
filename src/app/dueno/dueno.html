<div class="admin" [class.admin--nav-cerrado]="sidebarColapsado">
	<aside class="admin-nav" id="admin-nav">
		<a routerLink="/mi-finca" class="admin-nav__brand" aria-label="Renfi, ir al resumen de mi finca">
			<svg class="admin-nav__mark" viewBox="0 0 32 32" aria-hidden="true">
				<rect width="32" height="32" rx="9" fill="#081c15" />
				<path d="M6 15.5 16 7l10 8.5" fill="none" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
				<path d="M9.5 14.6V24h13v-9.4" fill="none" stroke="#fcfbf9" stroke-width="2" stroke-linejoin="round" />
				<path d="M14 24v-3.8a2 2 0 0 1 4 0V24" fill="none" stroke="#fcfbf9" stroke-width="2" />
			</svg>
			<span class="admin-nav__brand-copy">
				<span class="admin-nav__name">Renfi</span>
				<span class="admin-nav__sub">Mi finca</span>
			</span>
		</a>

		<nav class="admin-nav__menu" aria-label="Navegación del dueño de finca">
			<ul class="admin-nav__list">
				<li *ngFor="let link of navLinks">
					<a
						[routerLink]="link.route"
						routerLinkActive="is-active"
						ariaCurrentWhenActive="page"
						[routerLinkActiveOptions]="{ exact: link.route === '/mi-finca' }"
						class="admin-nav__link"
					>
						<span [ngSwitch]="link.icon" class="admin-nav__icon">
							<svg *ngSwitchCase="'inicio'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="3" y="3" width="7" height="9" rx="1"></rect>
								<rect x="14" y="3" width="7" height="5" rx="1"></rect>
								<rect x="14" y="12" width="7" height="9" rx="1"></rect>
								<rect x="3" y="16" width="7" height="5" rx="1"></rect>
							</svg>
							<svg *ngSwitchCase="'fincas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
								<polyline points="9 22 9 12 15 12 15 22"></polyline>
							</svg>
							<svg *ngSwitchCase="'reservas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="3" y="4" width="18" height="18" rx="2"></rect>
								<line x1="16" y1="2" x2="16" y2="6"></line>
								<line x1="8" y1="2" x2="8" y2="6"></line>
								<line x1="3" y1="10" x2="21" y2="10"></line>
							</svg>
							<svg *ngSwitchCase="'ingresos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="2" y="5" width="20" height="14" rx="2"></rect>
								<line x1="2" y1="10" x2="22" y2="10"></line>
							</svg>
						</span>
						<span class="admin-nav__label">{{ link.label }}</span>
					</a>
				</li>
			</ul>
		</nav>

		<div class="admin-nav__foot">
			<a routerLink="/inicio" class="admin-nav__portal">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
					<polyline points="15 3 21 3 21 9"></polyline>
					<line x1="10" y1="14" x2="21" y2="3"></line>
				</svg>
				<span>Ver portal público</span>
			</a>
		</div>
	</aside>

	<button type="button" class="admin-overlay" *ngIf="!sidebarColapsado" (click)="alternarSidebar()" aria-label="Ocultar menú lateral"></button>

	<div class="admin-col">
		<app-header-administrador
			[titulo]="tituloActual"
			[descripcion]="descripcionActual"
			[sidebarColapsado]="sidebarColapsado"
			(menuToggle)="alternarSidebar()"
		></app-header-administrador>

		<div class="admin-content">
			<router-outlet></router-outlet>
		</div>
	</div>
</div>
